# $schema: https://tourde.cloud/api/v2/schema
exposedPort: 80
containers:
  - name: web
    image: registry.tourde.cloud/nullptr/web
    port: 80
  - name: server
    image: registry.tourde.cloud/nullptr/server
    port: 8080
    env:
      PORT: "8080"
      VITE_SUPABASE_URL: "{{VITE_SUPABASE_URL}}"
      VITE_SUPABASE_PUBLISHABLE_KEY: "{{VITE_SUPABASE_PUBLISHABLE_KEY}}"
      VITE_JWT_SECRET: "{{VITE_JWT_SECRET}}"
build:
  - name: web
    context: .
  - name: server
    context: .
    dockerfile: ./server/Dockerfile